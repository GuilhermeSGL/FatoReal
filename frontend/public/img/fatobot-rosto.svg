<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <!-- Rosto do FatoBot (bolinha): mesmo desenho, com casco perolado, visor espelhado e olhos brilhando -->
  <defs>
    <radialGradient id="fundo" cx=".5" cy=".35" r=".75"><stop offset="0" stop-color="#22806f"/><stop offset=".6" stop-color="#11424f"/><stop offset="1" stop-color="#0a2340"/></radialGradient>
    <radialGradient id="casco" cx=".35" cy=".25" r=".95"><stop offset="0" stop-color="#ffffff"/><stop offset=".6" stop-color="#eef3f8"/><stop offset=".88" stop-color="#c9d4e1"/><stop offset="1" stop-color="#aebccd"/></radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22385c"/><stop offset=".5" stop-color="#0d1a30"/><stop offset="1" stop-color="#050a14"/></linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".6" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset=".6" stop-color="#3b8ef5"/><stop offset="1" stop-color="#2563c9"/></linearGradient>
    <radialGradient id="olho" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#e9fdff"/><stop offset=".35" stop-color="#7ff0ff"/><stop offset="1" stop-color="#16c3ea"/></radialGradient>
    <radialGradient id="aro" cx=".5" cy=".5" r=".5"><stop offset=".86" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".35"/></radialGradient>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>
  <circle cx="60" cy="60" r="60" fill="url(#fundo)"/>
  <circle cx="60" cy="60" r="60" fill="url(#aro)"/>
  <path d="M60 14v10" stroke="#d6dee8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="60" cy="13" r="7" fill="#3fe0ff" filter="url(#brilho)" opacity=".6"/><circle cx="60" cy="13" r="5" fill="url(#olho)"/><circle cx="58.3" cy="11.3" r="1.5" fill="#fff"/>
  <rect x="16" y="50" width="12" height="26" rx="6" fill="url(#azul)"/><rect x="92" y="50" width="12" height="26" rx="6" fill="url(#azul)"/>
  <rect x="18.5" y="53" width="3" height="16" rx="1.5" fill="#fff" opacity=".5"/><rect x="94.5" y="53" width="3" height="16" rx="1.5" fill="#fff" opacity=".5"/>
  <rect x="22" y="24" width="76" height="72" rx="30" fill="url(#casco)"/>
  <rect x="22.5" y="24.5" width="75" height="71" rx="29.5" fill="none" stroke="#fff" stroke-width="1" opacity=".7"/>
  <rect x="31" y="40" width="58" height="40" rx="18" fill="url(#visor)"/>
  <rect x="31" y="40" width="58" height="40" rx="18" fill="none" stroke="#8aa0bd" stroke-width="1.4" opacity=".6"/>
