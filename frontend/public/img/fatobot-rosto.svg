  <circle cx="47" cy="58" r="6" fill="url(#olho)"/><circle cx="73" cy="58" r="6" fill="url(#olho)"/>
  <circle cx="45" cy="56" r="1.8" fill="#fff"/><circle cx="71" cy="56" r="1.8" fill="#fff"/>
  <path d="M53 70q7 5 14 0" fill="none" stroke="#3fe0ff" stroke-width="5" stroke-linecap="round" filter="url(#brilho)" opacity=".55"/>
  <path d="M53 70q7 5 14 0" fill="none" stroke="#9ff6ff" stroke-width="3" stroke-linecap="round"/>
  <path d="M37 46 q6 -5 18 -5 l-15 27 q-6 -9 -3 -22z" fill="url(#reflexo)"/>
  <ellipse cx="44" cy="31" rx="13" ry="4" fill="#fff" opacity=".9"/>
