<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 260">
  <!-- FatoBot: mesmo desenho de sempre, com mais volume (casco perolado, visor espelhado, luzes) -->
  <defs>
    <radialGradient id="casco" cx=".35" cy=".25" r=".95"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#eef3f8"/><stop offset=".85" stop-color="#c9d4e1"/><stop offset="1" stop-color="#aebccd"/></radialGradient>
    <radialGradient id="cascoBraco" cx=".3" cy=".2" r="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".7" stop-color="#dfe7f0"/><stop offset="1" stop-color="#aebccd"/></radialGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#22385c"/><stop offset=".5" stop-color="#0d1a30"/><stop offset="1" stop-color="#050a14"/></linearGradient>
    <linearGradient id="reflexo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset=".6" stop-color="#3b8ef5"/><stop offset="1" stop-color="#2563c9"/></linearGradient>
    <radialGradient id="metal" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#5a7396"/><stop offset=".7" stop-color="#2b3f5c"/><stop offset="1" stop-color="#1a2840"/></radialGradient>
    <radialGradient id="olho" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#e9fdff"/><stop offset=".35" stop-color="#7ff0ff"/><stop offset="1" stop-color="#16c3ea"/></radialGradient>
    <radialGradient id="peito" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#ffffff"/><stop offset=".4" stop-color="#bff0ff"/><stop offset="1" stop-color="#39b6f0"/></radialGradient>
    <filter id="brilho" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="sombra" x="-25%" y="-20%" width="150%" height="150%"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#0b1a2e" flood-opacity=".35"/></filter>
    <filter id="interna" x="-10%" y="-10%" width="120%" height="120%"><feOffset dy="3"/><feGaussianBlur stdDeviation="3" result="b"/><feComposite in="SourceGraphic" in2="b" operator="arithmetic" k2="-1" k3="1" result="i"/><feFlood flood-color="#000" flood-opacity=".55"/><feComposite in2="i" operator="in"/><feComposite in2="SourceGraphic" operator="over"/></filter>
  </defs>
  <g filter="url(#sombra)">
    <!-- antena -->
    <path d="M100 30v20" stroke="#d6dee8" stroke-width="8" stroke-linecap="round"/>
    <path d="M98 32v16" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>
    <circle cx="100" cy="24" r="12" fill="#3fe0ff" filter="url(#brilho)" opacity=".55"/>
    <circle cx="100" cy="24" r="9" fill="url(#olho)"/>
    <circle cx="97" cy="21" r="2.6" fill="#fff"/>
    <!-- corpo -->
    <rect x="58" y="150" width="84" height="74" rx="34" fill="url(#casco)"/>
    <path d="M66 168 q34 -12 68 0" stroke="#aebccd" stroke-width="1.6" fill="none" opacity=".7"/>
    <ellipse cx="84" cy="160" rx="16" ry="5" fill="#fff" opacity=".8"/>
    <circle cx="100" cy="188" r="18" fill="#39b6f0" filter="url(#brilho)" opacity=".45"/>
    <circle cx="100" cy="188" r="13" fill="url(#peito)" stroke="url(#azul)" stroke-width="3.5"/>
    <circle cx="96" cy="184" r="3.2" fill="#fff" opacity=".95"/>
    <!-- pernas -->
    <rect x="70" y="214" width="22" height="32" rx="10" fill="url(#cascoBraco)"/><rect x="108" y="214" width="22" height="32" rx="10" fill="url(#cascoBraco)"/>
    <rect x="74" y="218" width="5" height="20" rx="2.5" fill="#fff" opacity=".7"/><rect x="112" y="218" width="5" height="20" rx="2.5" fill="#fff" opacity=".7"/>
    <ellipse cx="81" cy="248" rx="14" ry="7" fill="url(#metal)"/><ellipse cx="119" cy="248" rx="14" ry="7" fill="url(#metal)"/>
    <ellipse cx="77" cy="245.5" rx="5" ry="1.8" fill="#fff" opacity=".35"/><ellipse cx="115" cy="245.5" rx="5" ry="1.8" fill="#fff" opacity=".35"/>
    <!-- braço esquerdo -->
    <g transform="rotate(14 47 160)"><rect x="34" y="158" width="26" height="54" rx="13" fill="url(#cascoBraco)"/><rect x="39" y="163" width="6" height="36" rx="3" fill="#fff" opacity=".7"/></g>
    <circle cx="40" cy="214" r="11" fill="url(#metal)"/><circle cx="36.5" cy="210.5" r="3" fill="#fff" opacity=".35"/>
    <!-- braço direito acenando -->
    <g transform="rotate(28 153 168)"><rect x="140" y="112" width="26" height="58" rx="13" fill="url(#cascoBraco)"/><rect x="145" y="117" width="6" height="40" rx="3" fill="#fff" opacity=".7"/></g>
    <circle cx="178" cy="114" r="13" fill="url(#metal)"/><circle cx="174" cy="110" r="3.4" fill="#fff" opacity=".35"/>
    <!-- orelhas -->
    <rect x="26" y="78" width="20" height="44" rx="10" fill="url(#azul)"/><rect x="154" y="78" width="20" height="44" rx="10" fill="url(#azul)"/>
    <rect x="30" y="83" width="5" height="28" rx="2.5" fill="#fff" opacity=".5"/><rect x="158" y="83" width="5" height="28" rx="2.5" fill="#fff" opacity=".5"/>
    <!-- cabeça -->
    <rect x="36" y="44" width="128" height="112" rx="50" fill="url(#casco)"/>
    <rect x="36.5" y="44.5" width="127" height="111" rx="49.5" fill="none" stroke="#fff" stroke-width="1.5" opacity=".7"/>
    <!-- visor -->
    <rect x="52" y="70" width="96" height="62" rx="28" fill="url(#visor)" filter="url(#interna)"/>
    <rect x="52" y="70" width="96" height="62" rx="28" fill="none" stroke="#8aa0bd" stroke-width="2" opacity=".6"/>
    <g fill="#3fe0ff"><circle cx="80" cy="99" r="15" filter="url(#brilho)" opacity=".75"/><circle cx="120" cy="99" r="15" filter="url(#brilho)" opacity=".75"/></g>
    <circle cx="80" cy="99" r="10" fill="url(#olho)"/><circle cx="120" cy="99" r="10" fill="url(#olho)"/>
    <circle cx="76.5" cy="95.5" r="3" fill="#fff"/><circle cx="116.5" cy="95.5" r="3" fill="#fff"/>
    <path d="M90 118q10 7 20 0" fill="none" stroke="#3fe0ff" stroke-width="7" stroke-linecap="round" filter="url(#brilho)" opacity=".6"/>
    <path d="M90 118q10 7 20 0" fill="none" stroke="#9ff6ff" stroke-width="4.5" stroke-linecap="round"/>
    <!-- reflexo do visor -->
    <path d="M62 80 q10 -8 30 -8 l-26 44 q-8 -14 -4 -36z" fill="url(#reflexo)"/>
    <!-- brilho do casco -->
    <ellipse cx="76" cy="56" rx="22" ry="6.5" fill="#fff" opacity=".95"/>
    <ellipse cx="136" cy="140" rx="12" ry="4" fill="#fff" opacity=".35" transform="rotate(-25 136 140)"/>
  </g>
</svg>
